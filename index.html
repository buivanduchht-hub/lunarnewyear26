<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chúc Mừng Năm Mới 2026 🎇🎶</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(#000010, #000000);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
    }
    .headline {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      z-index: 1;
    }
    .headline .main {
      font-size: 46px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff007f, #ffdd00, #00ffea, #ff00ff, #00ff00);
      -webkit-background-clip: text;
      color: transparent;
      animation: glowText 3s ease-in-out infinite;
    }
    @keyframes glowText {
      0% { text-shadow: 0 0 6px #fff, 0 0 12px #ff007f, 0 0 24px #ff007f; }
      50% { text-shadow: 0 0 6px #fff, 0 0 12px #00ffea, 0 0 24px #00ffea; }
      100% { text-shadow: 0 0 6px #fff, 0 0 12px #ffdd00, 0 0 24px #ffdd00; }
    }
    @media (max-width: 768px) {
      .headline .main {
        font-size: 32px;
        animation: glowText 4s ease-in-out infinite;
      }
    }
    #playBtn {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 16px;
      background: #ff007f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="headline">
    <span class="main">Chúc Mừng Năm Mới 2026 🎇🎶</span>
  </div>

  <!-- Nút bật nhạc -->
  <button id="playBtn">Bật nhạc Tết 🎶</button>

  <!-- Nhạc nền -->
  <audio id="bg-music" loop>
    <source src="nhac-tet.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    const GRAVITY = 0.06;
    const COLORS = ['#ff007f', '#ffdd00', '#00ffea', '#ff00ff', '#00ff00', '#ff4500', '#ffffff'];
    const particles = [];
    const rockets = [];

    class Particle {
      constructor(x, y, angle, speed, color, size) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 0.006 + Math.random() * 0.01;
        this.color = color;
        this.size = size;
        this.prevX = x;
        this.prevY = y;
      }
      update() {
        this.prevX = this.x;
        this.prevY = this.y;
        this.vx *= 0.985;
        this.vy *= 0.985;
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const alpha = Math.max(this.life, 0);
        ctx.strokeStyle = `rgba(${hexToRgb(this.color)}, ${alpha})`;
        ctx.lineWidth = this.size * alpha; // kích thước tạo hiệu ứng 3D
        ctx.beginPath();
        ctx.moveTo(this.prevX, this.prevY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        ctx.restore();
      }
      get alive() { return this.life > 0; }
    }

    class Rocket {
      constructor(x, targetY, color) {
        this.x = x;
        this.y = H;
        this.vy = -(4 + Math.random() * 2);
        this.color = color;
        this.targetY = targetY;
        this.alive = true;
      }
      update() {
        this.y += this.vy;
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (this.y <= this.targetY) {
          explode(this.x, this.y, this.color);
          this.alive = false;
        }
      }
    }

    function explode(x, y, color) {
      const count = 80 + Math.floor(Math.random() * 40);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2) * (i / count) + (Math.random() * 0.05);
        const speed = 2.5 + Math.random() * 2.5;
        const size = 1 + Math.random() * 2; // kích thước khác nhau tạo chiều sâu
        particles.push(new Particle(x, y, angle, speed, color, size));
      }
    }

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `${r},${g},${b}`;
    }

    function clearCanvas() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, W, H);
    }

    function loop() {
      clearCanvas();
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        if (r.alive) r.update();
        else rockets.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.alive) p.update();
        else particles.splice(i, 1);
      }
      requestAnimationFrame(loop);
    }

    setInterval(() => {
      const x = W * (0.2 + Math.random() * 0.6);
      const targetY = H * (0.3 + Math.random() * 0.4);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      rockets.push(new Rocket(x, targetY, color));
    }, 1600);

    loop();

    // Nhạc nền
    const btn = document.getElementById('playBtn');
    const music = document.getElementById('bg-music');
    btn.addEventListener('click', () => {
      music.play();
      btn.style.display = 'none';
    });
  </script>
</body>
</html>
